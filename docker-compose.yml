version: '3.8'

services:
  app:
    image: uaifood:latest
    container_name: uaifood-app
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/uaifood?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
      - LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL=TRACE
    depends_on:
      db:
        condition: service_healthy
    networks:
      - uaifood-network
    restart: on-failure

  db:
    image: mysql:8.0
    platform: linux/amd64 # Importante para compatibilidade em ambientes M1/M2
    container_name: uaifood-mysql
    ports:
      - "3307:3306" # Usando porta 3307 no host para evitar conflitos
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=uaifood
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      # Configuração de inicialização mais rápida
      - MYSQL_INITDB_SKIP_TZINFO=1
    volumes:
      - ./mysql-data:/var/lib/mysql # Volume local na pasta atual
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql # Script de inicialização
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - uaifood-network
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=128M
      --wait_timeout=28800
      --connect_timeout=60

networks:
  uaifood-network:
    driver: bridge